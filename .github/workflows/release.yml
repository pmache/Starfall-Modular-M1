name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do wydania (np. v0.1.0); notatki z .github/release-notes/<tag>.md"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Oznacz jako pre-release"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRE: ${{ github.event_name == 'push' && 'true' || github.event.inputs.prerelease }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          [ -f "$notes" ] || { echo "Brak $notes"; exit 1; }
          args=(--target "$GITHUB_SHA" --title "Starfall Modular M1 ${TAG}" --notes-file "$notes")
          [ "$PRE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}"
